spring.application.name=shiguang-shopping
server.address=${SHOP_HOST:127.0.0.1}
server.port=${SHOP_PORT:8091}
shop.data-dir=${SHOP_DATA_DIR:../data}
shop.admin-password=${SHOP_ADMIN_PASSWORD:}
shop.secure-cookie=${SHOP_SECURE_COOKIE:false}
spring.datasource.url=jdbc:h2:file:${shop.data-dir}/shopping;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${SHOP_DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${shop.secure-cookie}
server.error.include-message=never
spring.web.resources.static-locations=classpath:/static/,file:../frontend/dist/
